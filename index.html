<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110e1a">
  <meta name="description" content="三关答题，两种结局。一个仅供朋友间娱乐的互动问答小游戏。">
  <title>良心大考验</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="./js/fireworks.js"></script>
  <script defer src="./js/main.js"></script>
</head>
<body data-theme="courage">
  <canvas id="stars" class="sky" aria-hidden="true"></canvas>
  <canvas id="effects" class="sky" aria-hidden="true"></canvas>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <img src="./assets/mark.svg" alt="" width="42" height="42">
        <span data-copy="title"></span>
      </div>
      <div class="progress" role="group" data-label="ui.progress">
        <span id="progress-count" class="progress-count" aria-hidden="true"><strong>01</strong> / 03</span>
        <ol id="progress-steps" class="progress-steps">
          <li><span class="sr-only" data-copy="courage.stage"></span></li>
          <li><span class="sr-only" data-copy="honesty.stage"></span></li>
          <li><span class="sr-only" data-copy="final.stage"></span></li>
        </ol>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="stage-bar">
        <div class="stage-label"><span class="signal" aria-hidden="true"></span><span id="stage-label"></span></div>
        <button class="text-button" type="button" data-action="skip" hidden>
          <span data-copy="ui.skip"></span><span aria-hidden="true">»</span>
        </button>
      </div>

      <div class="stage-body">
        <section class="scene question-scene" data-scene="courage" aria-labelledby="courage-title">
          <div class="question-content">
            <h1 class="question" id="courage-title" tabindex="-1" data-question="courage.question"></h1>
            <p class="support" data-copy="courage.support"></p>
            <div class="actions">
              <button class="button button-primary start-button" type="button" data-action="ready">
                <span data-copy="courage.answer"></span><span class="arrow" aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
        </section>

        <section class="scene question-scene" data-scene="honesty" aria-labelledby="honesty-title" hidden>
          <div class="question-content">
            <h1 class="question" id="honesty-title" tabindex="-1" data-question="honesty.question"></h1>
            <div class="actions choices">
              <button class="button button-primary" type="button" data-action="promise">
                <span class="choice-key" aria-hidden="true">A</span><span data-copy="honesty.yes"></span><span class="arrow" aria-hidden="true">↗</span>
              </button>
              <button class="button button-secondary" type="button" data-action="hesitate">
                <span class="choice-key" aria-hidden="true">B</span><span data-copy="honesty.unsure"></span><span class="arrow" aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
        </section>

        <section class="scene intro-scene centered" data-scene="intro" aria-labelledby="intro-title" hidden>
          <span class="intro-star" aria-hidden="true">✧</span>
          <h1 id="intro-title" tabindex="-1" data-copy="final.intro"></h1>
          <span class="intro-meter" aria-hidden="true"><i></i></span>
        </section>

        <section class="scene question-scene" data-scene="final" aria-labelledby="final-title" hidden>
          <div class="question-content">
            <h1 class="question" id="final-title" tabindex="-1" data-question="final.question"></h1>
            <div class="actions choices">
              <button class="button button-primary" type="button" data-action="correct">
                <span class="choice-key" aria-hidden="true">A</span><span data-copy="final.yes"></span><span class="arrow" aria-hidden="true">↗</span>
              </button>
              <button class="button button-secondary" type="button" data-action="doubt">
                <span class="choice-key" aria-hidden="true">B</span><span data-copy="final.no"></span><span class="arrow" aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
        </section>

        <section class="scene centered result-scene" data-scene="victory" aria-labelledby="victory-title" hidden>
          <div class="result-card">
            <div class="medal" aria-hidden="true"><span>🏆</span></div>
            <h1 id="victory-title" tabindex="-1" data-copy="victory.title"></h1>
            <p class="support" data-copy="victory.subtitle"></p>
            <p class="award" data-copy="victory.award"></p>
            <div class="score">
              <span data-copy="victory.score"></span>
              <span class="score-number" aria-hidden="true"><b id="score-number">0</b> / 100</span>
              <span class="sr-only">100 / 100</span>
              <div class="score-track" aria-hidden="true"><i id="score-fill"></i></div>
            </div>
            <p class="result-note" data-copy="victory.note"></p>
            <div class="actions result-actions">
              <button class="button button-primary" type="button" data-action="restart"><span data-copy="ui.restart"></span><span class="arrow" aria-hidden="true">↗</span></button>
              <button class="button button-secondary" type="button" data-action="replay"><span data-copy="victory.replay"></span><span aria-hidden="true">↻</span></button>
            </div>
          </div>
        </section>

        <section class="scene centered result-scene" data-scene="integrity" aria-labelledby="integrity-title" hidden>
          <div class="result-card">
            <div class="medal peaceful" aria-hidden="true"><span>☺</span></div>
            <h1 id="integrity-title" tabindex="-1" data-copy="integrity.title"></h1>
            <p class="support" data-copy="integrity.subtitle"></p>
            <div class="actions result-actions">
              <button class="button button-primary" type="button" data-action="restart"><span data-copy="ui.restart"></span><span class="arrow" aria-hidden="true">↗</span></button>
            </div>
          </div>
        </section>

        <div id="orbital" class="orbital" aria-hidden="true">
          <div class="instrument">
            <div class="instrument-glow"></div>
            <div class="axis axis-x"></div><div class="axis axis-y"></div>
            <div class="ring ring-outer"></div><div class="ring ring-ticks"></div>
            <div class="ring ring-middle"></div><div class="ring ring-inner"></div>
            <div class="orbital-ellipse"><i></i><i></i></div>
            <div class="orbital-ellipse crossed"><i></i></div>
            <span class="orbital-glint glint-one">✧</span><span class="orbital-glint glint-two">✦</span>
            <span class="orbital-glint glint-three">✧</span>
            <div class="rose-shadow"></div><div class="rose-core"></div>
            <div class="orbit-symbol orbit-check"><span>✓</span></div>
            <div class="orbit-symbol orbit-question"><span>?</span></div>
          </div>
        </div>

        <div id="confirmation" class="confirmation" hidden>
          <div class="confirmation-symbol" aria-hidden="true">✓</div>
          <p id="confirmation-text"></p>
        </div>
        <div id="announcement" class="sr-only" role="status"></div>
      </div>

      <div class="stage-base">
        <span class="stage-hint" id="stage-hint"></span>
        <button class="text-button spark-button" type="button" data-action="spark" hidden>
          <span aria-hidden="true">✧</span><span data-copy="ui.spark"></span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-line"></span><span data-copy="ui.footer"></span><span class="footer-line"></span>
    </footer>
  </div>

  <dialog id="decision-dialog" class="decision-dialog" aria-labelledby="decision-title" aria-describedby="decision-note">
    <div class="dialog-content">
      <button class="close-button" type="button" data-action="dismiss" data-label="ui.close">×</button>
      <div class="dialog-art" aria-hidden="true"><span>✧</span><div id="decision-icon"></div><span>?</span></div>
      <h2 id="decision-title" tabindex="-1"></h2>
      <p class="support" id="decision-note"></p>
      <div class="actions dialog-actions">
        <button class="button button-primary" type="button" data-action="dismiss"><span id="decision-back"></span><span class="arrow" aria-hidden="true">↗</span></button>
        <button class="button button-secondary" type="button" data-action="continue"><span id="decision-continue"></span></button>
      </div>
    </div>
  </dialog>

  <noscript><p class="no-script">请在浏览器中启用 JavaScript 后开始游戏。</p></noscript>
</body>
</html>
